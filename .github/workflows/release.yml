name: Release

# A tag vX.Y.Z is a release on both stores (see .claude/skills/publish-stores).
# Run by hand, only the build job runs and nothing is sent: a dry run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency: release

# Each job asks for what it needs. The store keys live in the `stores`
# environment, which only a v* tag can enter, and only the publish job reads
# them: it installs no package and runs no third-party action, so nothing but
# this repository's own scripts runs next to them.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # preflight compares with the previous tag: it needs the tags and history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: The tag is the version in package.json
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run release:check
      - name: Store clients against fake stores
        run: node scripts/stores/cws-selftest.mjs && node scripts/stores/amo-selftest.mjs

      # The AMO reviewer notes promise a byte-reproducible build: prove it here.
      - name: Build and pack twice, byte for byte
        run: |
          npm run package:all
          sha256sum release/*.zip > "$RUNNER_TEMP/first.sha"
          npm run package:all
          sha256sum -c "$RUNNER_TEMP/first.sha"

      - name: Source archive and store payloads
        run: |
          V=$(node -p "require('./package.json').version")
          git archive --format=zip --prefix="kick-chat-translator-$V/" -o "release/kick-chat-translator-$V-source.zip" HEAD
          node scripts/stores/payloads.mjs release/stores
          python3 test/audits/audit_fiche.py
          # What this release asks of a person in the Chrome dashboard, in the log
          # where a refusal would be read. It cannot tell whether it was done.
          node scripts/stores/preflight.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            release/*.zip
            release/stores
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: read
    steps:
      # The store scripts import Node built-ins only: no install step here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Store credentials
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          umask 077
          printf '%s' "$CWS_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/cws-key.json"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/amo-api.json", JSON.stringify({ issuer: process.env.AMO_JWT_ISSUER, secret: process.env.AMO_JWT_SECRET }))'

      # Each store is its own step and neither stops the other. In 3.0.2 Chrome
      # refused the submission (a permission without its justification in the
      # dashboard), the job stopped there, and AMO and the GitHub release were
      # skipped and had to be sent by hand. The outcome step below turns the job
      # red again once everything that could go has gone.

      # A submission still in review blocks a new package: this release replaces it.
      - name: Chrome Web Store
        id: chrome
        continue-on-error: true
        env:
          CWS_SA_KEY: ${{ runner.temp }}/cws-key.json
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          V=$(node -p "require('./package.json').version")
          node scripts/stores/cws.mjs cancel || echo "no submission in review to cancel"
          node scripts/stores/cws.mjs upload "release/kick-chat-translator-$V-chromium.zip" --publish

      - name: addons.mozilla.org
        id: amo
        continue-on-error: true
        env:
          AMO_API_KEY: ${{ runner.temp }}/amo-api.json
        run: |
          V=$(node -p "require('./package.json').version")
          node scripts/stores/amo.mjs release "release/kick-chat-translator-$V-firefox.zip" "release/kick-chat-translator-$V-source.zip" release/stores/amo-notes.json
          node scripts/stores/amo.mjs listing release/stores/amo-listing.json

      - name: Remove the store keys
        if: always()
        run: rm -f "$RUNNER_TEMP/cws-key.json" "$RUNNER_TEMP/amo-api.json"

      - name: Stores outcome
        env:
          CHROME: ${{ steps.chrome.outcome }}
          AMO: ${{ steps.amo.outcome }}
        run: |
          echo "Chrome Web Store: $CHROME"
          echo "addons.mozilla.org: $AMO"
          if [ "$CHROME" != success ]; then
            echo "::error title=Chrome Web Store::The package may be uploaded but not submitted. INVALID_ITEM_METADATA means the dashboard wants something no API can set (a permission justification, a privacy certification, a listing field). Fix it in the dashboard, then run: node scripts/stores/cws.mjs publish"
          fi
          if [ "$AMO" != success ]; then
            echo "::error title=addons.mozilla.org::Rerun by hand with the artifacts of this tag: node scripts/stores/amo.mjs release <firefox.zip> <source.zip> <amo-notes.json>"
          fi
          test "$CHROME" = success && test "$AMO" = success

  # The GitHub release goes out whatever the stores said, as it always did: a
  # red store step is fixed by hand from these very zips.
  github-release:
    needs: [build, publish]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # Signed provenance: anyone can check that a zip was built by this
      # workflow from this tag, with `gh attestation verify <zip> -R <repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*.zip

      - name: Release notes with checksums
        run: |
          { cat store/notes/en.txt; echo; echo '```'; (cd release && sha256sum *.zip); echo '```'; } > "$RUNNER_TEMP/release-notes.md"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          V=$(node -p "require('./package.json').version")
          cp "$BUNDLE" "release/kick-chat-translator-$V.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" release/*.zip "release/kick-chat-translator-$V.intoto.jsonl" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
